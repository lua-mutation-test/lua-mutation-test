[package]
name = "lua-mutation-test"
version = "0.0.5"
edition = "2021"
description = "A mutation testing tool for Lua, written in Rust."
repository = "https://github.com/lua-mutation-test/lua-mutation-test"
license = "Apache-2.0"
readme = "README.md"
keywords = ["lua", "mutation-testing", "testing"]
categories = ["development-tools::testing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tree-sitter = "0.25.3"
tree-sitter-lua = "0.5.0"
glob = "0.3"
notify = "8"
sha2 = "0.10"
ctrlc = "3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bin]]
name = "lua-mutation-test"
path = "src/main.rs"

[[bin]]
name = "lmut"
path = "src/main.rs"

[[bench]]
name = "mutation_benchmark"
harness = false


