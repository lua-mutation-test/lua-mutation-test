name: Feature request
description: Suggest an idea for lua-mutation-test.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting! Please see [CONTRIBUTING.md](../../CONTRIBUTING.md) for workflow guidelines.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who benefits (e.g. Neovim plugin authors, lux users)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution, with examples if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds?
    validations:
      required: false
