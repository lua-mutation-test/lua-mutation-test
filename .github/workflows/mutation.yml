name: Mutation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: Run cargo-mutants on Rust code
        id: mutants
        # Missed mutants are tracked on the Stryker dashboard, not gated here.
        continue-on-error: true
        run: |
          cargo mutants -v --in-place -- -- --skip watch
      - name: Convert to Stryker report
        if: always()
        run: |
          test -f mutants.out/outcomes.json
          python3 scripts/cargo-mutants-to-stryker.py mutants.out "$GITHUB_WORKSPACE" mutation-testing-report.json
      - name: Upload Stryker report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-report
          path: |
            mutation-testing-report.json
            mutants.out/outcomes.json
            mutants.out/caught.txt
            mutants.out/missed.txt
            mutants.out/timeout.txt
            mutants.out/unviable.txt
      - name: Publish to Stryker dashboard
        if: always()
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          curl -X PUT "https://dashboard.stryker-mutator.io/api/reports/github.com/lua-mutation-test/lua-mutation-test/${GITHUB_REF_NAME}" \
            -H "X-Api-Key: $STRYKER_DASHBOARD_API_KEY" \
            -H "Content-Type: application/json" \
            -d @mutation-testing-report.json
