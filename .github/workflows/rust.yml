name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install Lua
      run: sudo apt-get update && sudo apt-get install -y lua5.4
    - name: Fetch tree-sitter-lua grammar
      run: ./scripts/fetch-tree-sitter-lua.sh
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose