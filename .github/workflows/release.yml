name: Release

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/rust.yml

  release:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits@^7.0.0

      - name: Record current release tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"

      # Bumps Cargo.toml/Cargo.lock, tags the release, creates the GitHub
      # release, and publishes the bumped version to crates.io (see
      # .releaserc.json). Does nothing when no releasable commits exist.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: npx semantic-release

      - name: Check for new release
        id: new_release
        run: |
          git fetch --tags --force
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$NEW_TAG" != "$PREV_TAG" ]; then
            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          fi

      # Built after the release so the binary embeds the new version.
      - name: Build release binary
        if: steps.new_release.outputs.tag != ''
        run: cargo build --release --bin lua-mutation-test

      - name: Package and upload release binary
        if: steps.new_release.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          tar -czf "dist/lua-mutation-test-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release lua-mutation-test
          gh release upload "${{ steps.new_release.outputs.tag }}" \
            "dist/lua-mutation-test-x86_64-unknown-linux-gnu.tar.gz" --clobber
